<style>
/* 플랜비 공통 디자인 가이드(docs/디자인_가이드__공통_.md) 토큰.
   이 제품 고유 확장은 --up / --down (시세 등락) 뿐이다. */
:root{
  color-scheme:dark;
  --ground:#0E0E11;  --surface:#17171B;  --surface-2:#1C1C21;
  --line:#2A2A31;    --line-strong:#4A4A55;
  --ink:#F2F2F4;     --ink-2:#C6C6CC;    --ink-3:#96969E;   --ink-4:#7B7B85;
  --accent:#8E9BFF;  --accent-hover:#A5B0FF;  --accent-rgb:142 155 255;
  --accent-soft:rgb(var(--accent-rgb) / .14);
  --ok:#30DB5B;  --warn:#FFB340;  --danger:#FF6961;
  /* 제품 확장 — 시세 등락. 한국 관행에 따라 상승 빨강 / 하락 파랑. */
  --up:#FF5A52;  --down:#5AA0FF;
  --sans:'Pretendard Variable',Pretendard,'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  --display:var(--sans);
  /* 기존 클래스 호환 별칭 */
  --bg:var(--ground); --t1:var(--ink); --t2:var(--ink-3); --t3:var(--ink-4);
  --line-2:var(--line); --sunk:var(--surface); --card:var(--surface);
  --up-bg:rgb(255 90 82 / .13); --down-bg:rgb(90 160 255 / .13); --accent-bg:var(--accent-soft);
  --shadow:none; --r:18px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --ground:#FFFFFF; --surface:#F5F5F7; --surface-2:#FAFAFB;
  --line:#E5E5EA; --line-strong:#8B95A9;
  --ink:#1D1D1F; --ink-2:#494950; --ink-3:#6E6E73; --ink-4:#86868B;
  --accent:#4659EF; --accent-hover:#3847CF; --accent-soft:rgb(70 89 239 / .08);
  --ok:#248A3D; --warn:#C93400; --danger:#D70015;
  --up:#D70015; --down:#0B5FD0;
  --up-bg:rgb(215 0 21 / .07); --down-bg:rgb(11 95 208 / .07);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --ground:#FFFFFF; --surface:#F5F5F7; --surface-2:#FAFAFB;
  --line:#E5E5EA; --line-strong:#8B95A9;
  --ink:#1D1D1F; --ink-2:#494950; --ink-3:#6E6E73; --ink-4:#86868B;
  --accent:#4659EF; --accent-hover:#3847CF; --accent-soft:rgb(70 89 239 / .08);
  --ok:#248A3D; --warn:#C93400; --danger:#D70015;
  --up:#D70015; --down:#0B5FD0;
  --up-bg:rgb(215 0 21 / .07); --down-bg:rgb(11 95 208 / .07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:17px;font-weight:400;line-height:1.59;letter-spacing:normal;
  -webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--display);letter-spacing:normal}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.up{color:var(--up)}.down{color:var(--down)}.t2{color:var(--ink-3)}.t3{color:var(--ink-4)}
a{color:inherit}
button{font:inherit;color:inherit}

/* ---------- nav (애플식 얇은 상단바) ---------- */
.hd{position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line-2);padding-top:env(safe-area-inset-top)}
.hd-in{max-width:980px;margin:0 auto;padding:0 22px;height:52px;display:flex;align-items:center;gap:24px}
.brand{font-size:19px;font-weight:700;white-space:nowrap}
.seg{display:flex;gap:26px;margin-left:6px}
.seg button{appearance:none;border:0;background:none;font-size:14px;font-weight:400;
  color:var(--t2);padding:4px 0;cursor:pointer;transition:color .2s}
.seg button:hover{color:var(--t1)}
.seg button[aria-selected="true"]{color:var(--ink);font-weight:700}
.hd-act{margin-left:auto;display:flex;gap:2px;align-items:center}
.iconbtn{appearance:none;border:0;background:none;color:var(--t2);width:34px;height:34px;
  border-radius:50%;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;
  justify-content:center;transition:color .2s,background .2s}
.iconbtn:hover{color:var(--t1);background:var(--surface-2)}
.mstate{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.led{width:6px;height:6px;border-radius:50%;background:var(--t3)}
.led.open{background:var(--up);animation:pulse 2.4s ease-in-out infinite}
.led.pre,.led.post{background:#ff9f0a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- hero ---------- */
.hero{max-width:980px;margin:0 auto;padding:34px 22px 20px;text-align:center}
.hero h1{margin:0;font-size:clamp(30px,5vw,46px);font-weight:800;
  line-height:1.18;text-wrap:balance}
.hero p{margin:14px auto 0;max-width:620px;font-size:17px;color:var(--ink-3);
  line-height:1.59;text-wrap:balance}
.hero .stamp{margin-top:20px;font-size:13px;color:var(--t3)}

/* ---------- layout ---------- */
main{max-width:980px;margin:0 auto;padding:0 22px 40px}
.view[hidden]{display:none}
.card{background:transparent;border-radius:0;box-shadow:none;padding:0;margin:0}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:76px 0 6px;padding-top:0}
.sec-h h2{margin:0;font-size:clamp(24px,3.4vw,34px);font-weight:700;line-height:1.3}
.sec-h .n{font-size:14px;color:var(--t3);font-weight:400}
.sec-d{margin:0 0 22px;font-size:17px;color:var(--ink-3);line-height:1.59}

/* ---------- 시장 지표 (히어로 하단 인라인) ---------- */

/* ---------- 종목 행 ---------- */
.picks{display:flex;flex-direction:column;border-top:1px solid var(--line-2)}
.pick{display:block;padding:22px 4px;border-bottom:1px solid var(--line-2);
  cursor:default;transition:background .18s;margin:0 -8px;padding-left:12px;padding-right:12px}
.pick:hover{background:var(--surface-2)}
.pick-top{display:flex;align-items:center;gap:11px}
.pick-top .rank{margin-right:2px}
.pick-tk{font-size:20px;font-weight:700}
.pick-nm{font-size:15px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0;}
.pick-px{margin-left:auto;text-align:right;flex:0 0 auto;display:flex;align-items:baseline;gap:12px}
.pick-px .p{font-size:18px;font-weight:700}
.pick-px .c{font-size:16px;font-weight:500}
.pick-bot{display:flex;align-items:center;gap:10px;margin-top:12px}
.why{display:flex;gap:16px;flex-wrap:wrap;min-width:0}
.why span{font-size:14px;color:var(--t2);background:none;padding:0;border-radius:0;
  white-space:nowrap;}
.why span+span{position:relative;padding-left:16px}
.why span+span::before{content:"";position:absolute;left:0;top:50%;width:3px;height:3px;
  border-radius:50%;background:var(--line);transform:translateY(-50%)}
.pick-sp{margin-left:auto;flex:0 0 auto;opacity:.6}
.more:hover{color:var(--accent-hover);text-decoration:underline}
.empty{font-size:17px;color:var(--t3);padding:26px 4px;}
details.rules{margin-top:20px;border-top:1px solid var(--line-2);padding-top:16px}
details.rules summary{font-size:15px;color:var(--accent);cursor:pointer;list-style:none;padding:2px 0}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::after{content:" ⌄"}
details.rules[open] summary::after{content:" ⌃"}
.rulelist{display:flex;gap:10px;flex-wrap:wrap;padding:14px 0 2px}
.rulelist span{font-size:14px;color:var(--ink-3);background:var(--surface);
  padding:7px 13px;border-radius:980px}

/* ---------- 뉴스 ---------- */
.news{display:flex;flex-direction:column;border-top:1px solid var(--line-2)}
.na{display:block;padding:26px 12px;border-bottom:1px solid var(--line-2);text-decoration:none;
  margin:0 -8px;transition:background .18s}
.na:hover{background:var(--surface-2)}
.na .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:0;border-radius:0;
  background:none;color:var(--t3);margin-bottom:8px;letter-spacing:.02em;text-transform:uppercase}
.na .tag.mine{color:var(--accent)}
.na h3{margin:0;font-size:20px;font-weight:700;line-height:1.35}
.na .meta{margin-top:9px;font-size:14px;color:var(--t3)}

/* ---------- 내 자산 ---------- */
.pf-hero{text-align:center;padding:22px 0 6px}
.pf-hero .l{font-size:15px;color:var(--t2)}
.pf-hero .v{font-size:clamp(38px,6.6vw,52px);font-weight:800;margin-top:8px;line-height:1.16}
.pf-hero .c{font-size:19px;font-weight:700;margin-top:10px}
.pf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:38px;
  border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.pf-grid div{background:none;border-radius:0;padding:20px 12px;text-align:center;
  border-right:1px solid var(--line-2)}
.pf-grid div:last-child{border-right:0}
.pf-grid .l{font-size:13px;color:var(--t3)}
.pf-grid .v{font-size:21px;font-weight:700;margin-top:5px}
.hold{display:flex;align-items:center;gap:12px;padding:20px 12px;border-bottom:1px solid var(--line-2);margin:0 -8px}
.hold .tk{font-size:18px;font-weight:700}
.hold .qt{font-size:14px;color:var(--t3);margin-top:3px}
.hold .r{margin-left:auto;text-align:right}
.hold .r .a{font-size:17px;font-weight:700}
.hold .r .b{font-size:14px;font-weight:700;margin-top:3px}
.hold .x{appearance:none;border:0;background:none;color:var(--t3);cursor:pointer;padding:8px;
  font-size:16px;border-radius:50%;flex:0 0 auto}
.hold .x:hover{color:var(--up);background:var(--up-bg)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.form input{font:inherit;font-size:17px;color:var(--ink);background:var(--ground);
  border:1px solid var(--line-strong);border-radius:12px;padding:11px 14px;width:100%;min-height:44px}
.form input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form input::placeholder{color:var(--t3)}
.btn{appearance:none;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:600;
  padding:13px 26px;border-radius:980px;cursor:pointer;width:auto;margin-top:20px;}
.btn:hover{background:var(--accent-hover)}
.btn.sub{background:none;color:var(--accent);padding:13px 0;margin-top:12px;font-size:15px}
.btn.sub:hover{text-decoration:underline;filter:none}
.btn-row{display:flex;gap:26px}
.hint{font-size:15px;color:var(--t3);line-height:1.6;margin:18px 0 0;}
.hint b{color:var(--t2);font-weight:600}

/* ---------- 전체 표 ---------- */
details.all{margin-top:76px;border-top:1px solid var(--line-2);padding-top:26px}
details.all summary{cursor:pointer;list-style:none;font-size:17px;color:var(--accent);
  padding:0;background:none;border-radius:0;box-shadow:none;text-align:left}
details.all summary::-webkit-details-marker{display:none}
details.all summary::after{content:" ⌄"}
details.all[open] summary::after{content:" ⌃"}
.tools{display:flex;gap:12px;margin:22px 0}
.tools input,.tools select{font:inherit;font-size:15px;color:var(--t1);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.tools input{flex:1;min-width:0}
.scroll{overflow-x:auto;background:none;border-radius:0;box-shadow:none;padding:0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
th{font-size:13px;color:var(--ink-3);font-weight:600;cursor:pointer;user-select:none;
  position:sticky;top:52px;background:var(--surface-2)}
th:first-child,td:first-child{text-align:left;padding-left:4px}
tbody tr:last-child td{border-bottom:0}
td.tk{font-weight:700}
td.tk small{display:block;font-weight:400;font-size:13px;color:var(--t3);margin-top:2px}

/* ---------- 로고 ---------- */
.lg{flex:0 0 auto;border-radius:9px;background:var(--surface);object-fit:contain;
  display:inline-block;vertical-align:middle}
.lg.ph{display:inline-flex;align-items:center;justify-content:center;font-weight:600;
  color:var(--t3);}
.top .lg{border-radius:14px}

/* ---------- 카테고리 선택 ---------- */
/* ---------- 시장 토글 ---------- */
.mkts{display:inline-flex;gap:2px;padding:2px;background:var(--surface);border-radius:980px;
  margin:0 6px 0 0;flex:0 0 auto}
.mkts button{appearance:none;border:0;background:none;font-size:13px;font-weight:600;
  color:var(--ink-3);padding:6px 12px;border-radius:980px;cursor:pointer;transition:all .18s;
  font-family:inherit;white-space:nowrap}
.mkts button:hover{color:var(--ink)}
.mkts button[aria-selected="true"]{background:var(--ink);color:var(--ground)}

/* ---------- 전적 보드 ---------- */
.rec{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:0 0 18px;
  background:var(--ground);border-radius:14px;overflow:hidden}
.rec>div{background:var(--surface);padding:13px 12px;text-align:center;min-width:0}
.rec .l{font-size:11.5px;color:var(--ink-4);font-weight:500}
.rec .v{font-size:22px;font-weight:800;margin-top:3px;line-height:1.1}
.rec .s{font-size:11px;color:var(--ink-4);margin-top:2px}
.rec-none{margin:0 0 18px;padding:12px 14px;background:var(--surface);border-radius:12px;
  font-size:13.5px;color:var(--ink-4);line-height:1.5}
.rec-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:7px;background:var(--line)}
.rec-bar i{display:block;height:100%}

/* ---------- 카테고리 칩 ---------- */
/* 가로 스크롤 카드였다가 되돌렸다. 아홉 개를 훑어보는 데 큰 숫자는 필요 없었고,
   카드 높이 226px 탓에 한 화면에 1.5개밖에 안 들어왔다. */
.cats{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 20px}
.cat{appearance:none;border:0;cursor:pointer;background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:14.5px;font-weight:600;line-height:1;
  padding:11px 16px;border-radius:980px;white-space:nowrap;
  transition:background .18s cubic-bezier(.28,.11,.32,1)}
@media(hover:hover){.cat:hover{background:var(--line)}}
.cat:active{transform:scale(.97)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

/* ---------- 1위 카드 ---------- */
.top{display:block;padding:26px 22px;border:0;border-radius:18px;margin-bottom:10px;
  background:var(--surface);position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgb(0 0 0 / .04), 0 10px 30px -18px rgb(0 0 0 / .18)}
.top .rk{position:absolute;top:0;left:0;font-size:12px;font-weight:700;
  color:#fff;background:var(--accent);padding:6px 14px;border-bottom-right-radius:14px}
.top-h{display:flex;align-items:center;gap:14px;margin-top:14px}
.top-tk{font-size:34px;font-weight:800;line-height:1;flex:0 0 auto}
.top-nm{font-size:16px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0;flex:0 1 auto}
.top-px{margin-left:auto;text-align:right;flex:0 0 auto}
.top-px .p{font-size:26px;font-weight:700}
.top-px .c{font-size:17px;font-weight:500;margin-top:2px}
.top-why{margin-top:18px;font-size:17px;color:var(--t1);line-height:1.5;}
.top-why span{display:block;padding:7px 0;border-top:1px solid var(--line-2);color:var(--t2)}
.top-why span:first-child{border-top:0;padding-top:0;color:var(--ink);font-size:22px;font-weight:700;line-height:1.35}
.top-sp{margin-top:16px}
.top-sp svg{display:block;width:100%;height:64px}

/* ---------- 기준별 1위 (전체 보기) ---------- */
.lead{padding-top:14px}
.lead + .lead{border-top:1px solid var(--line-2)}
.lead-cat{appearance:none;border:0;background:none;cursor:pointer;font-family:inherit;
  display:block;padding:0 4px;color:var(--ink-3);font-size:13.5px;font-weight:600}
.lead-cat .n{color:var(--t4);font-weight:400;margin-left:4px}
.lead .rank{display:none}   /* 한 줄뿐이라 순위 번호가 뜻이 없다 */
@media(hover:hover){.lead-cat:hover{color:var(--accent)}}

/* ---------- 매매 신호 ---------- */
/* 상태는 색과 형태(점)를 같이 쓴다. 면을 칠하지 않는다 — 공통 가이드 §3 */
.sig{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;
  white-space:nowrap;color:var(--t3);flex:0 0 auto}
.sig i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.sig.buy{color:var(--up)}
.sig.exit{color:var(--down)}
.top-sig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  margin-top:16px;padding-top:15px;border-top:1px solid var(--line-2)}
.top-sig .sig{font-size:16px}
.top-sig .w{font-size:15px;color:var(--t2)}
.sig-lv{display:flex;gap:22px;margin-top:12px}
.sig-lv>div{flex:0 1 auto;min-width:0}
.sig-lv .k{font-size:12.5px;color:var(--t3)}
.sig-lv .v{font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.sig-lv .d{font-size:12.5px;margin-top:1px;font-variant-numeric:tabular-nums}
.sh-rule{margin:10px 0 0;padding:0 0 0 15px;font-size:14px;color:var(--t2);line-height:1.6}
.sh-rule li{margin:3px 0}
.sh-record{margin-top:10px;font-size:14px;color:var(--t2);line-height:1.6}
.sh-record b{font-weight:700;color:var(--ink)}
/* ---------- 전적 판 ---------- */

<script>
(function(){
"use strict";

/* ============ 순수 로직 (node 테스트에서 그대로 사용) ============ */
var NB = "—";
var STRAT_ACCENT = { momentum:"--s1", value_quality:"--s2", earnings:"--s3", oversold:"--s4" };
function has(v){ return v !== null && v !== undefined && !(typeof v === "number" && v !== v); }
function cmpVals(a, b, dir){
  var an = !has(a), bn = !has(b);
  if (an && bn) return 0;
  if (an) return 1;
  if (bn) return -1;
  var c;
  if (typeof a === "string" || typeof b === "string") c = String(a).localeCompare(String(b));
  else c = a < b ? -1 : a > b ? 1 : 0;
  return dir === "desc" ? -c : c;
}
function sortRows(rows, getter, dir){
  return rows.slice().sort(function(r1, r2){ return cmpVals(getter(r1), getter(r2), dir); });
}
function filterRows(rows, q, sector){
  var qq = (q || "").trim().toLowerCase();
  return rows.filter(function(r){
    if (sector && r.sector !== sector) return false;
    if (!qq) return true;
    return (r.ticker || "").toLowerCase().indexOf(qq) >= 0 ||
           (r.name   || "").toLowerCase().indexOf(qq) >= 0;
  });
}
function stratAccent(key){ return STRAT_ACCENT[key] || "--s5"; }
var PURE = { has:has, cmpVals:cmpVals, sortRows:sortRows, filterRows:filterRows,
             stratAccent:stratAccent, STRAT_ACCENT:STRAT_ACCENT,
             /* 함수 선언은 끌어올려지므로 아래에 정의돼 있어도 여기서 잡힌다.
                discover.py 의 signal_state() 와 짝이 맞는지 signal_parity_test.py 가 검사한다. */
             sigState:sigState };
if (typeof window === "undefined") { globalThis.__DISCOVER_PURE__ = PURE; return; }

/* ============ 포맷 ============ */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : "&quot;"; }); }
function usd(v, d){ return has(v) ? v.toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d}) : NB; }
function num1(v){ return has(v) ? v.toFixed(1) : NB; }
function pct1(v){ return has(v) ? (v > 0 ? "+" : "") + v.toFixed(1) + "%" : NB; }
function pct0(v){ return has(v) ? (v > 0 ? "+" : "") + Math.round(v) + "%" : NB; }
function won0(v){ return has(v) ? Math.round(v).toLocaleString("ko-KR") : NB; }
function swon(v){ return has(v) ? (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(Math.round(v)).toLocaleString("ko-KR") : NB; }
function eok(v){ if (!has(v)) return NB; var a = Math.abs(v);
  if (a >= 1e8) return (v / 1e8).toFixed(a >= 1e9 ? 0 : 1) + "억";
  if (a >= 1e4) return Math.round(v / 1e4) + "만"; return won0(v); }
function big(v){ if (!has(v)) return NB; var a = Math.abs(v);
  if (a >= 1e12) return (v / 1e12).toFixed(1) + "조"; 
  if (a >= 1e8)  return Math.round(v / 1e8) + "억";
  return String(Math.round(v)); }
function cls(v){ return !has(v) ? "t3" : v > 0 ? "up" : v < 0 ? "down" : "t2"; }
function ts(iso){ if (!iso) return NB; var d = new Date(iso); if (isNaN(d.getTime())) return NB;
  return d.toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit", hour12:false}); }
function relFresh(iso){
  if (!iso) return NB;
  var t = new Date(iso).getTime(); if (isNaN(t)) return NB;
  var s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 90) return "방금 갱신";
  if (s < 3600) return Math.round(s / 60) + "분 전";
  if (s < 86400) return Math.round(s / 3600) + "시간 전";
  return Math.round(s / 86400) + "일 전";
}
function relTime(iso){
  if (!iso) return "";
  var t = new Date(iso).getTime(); if (isNaN(t)) return "";
  var m = Math.round((Date.now() - t) / 60000);
  if (m < 60) return m + "분 전";
  if (m < 1440) return Math.round(m / 60) + "시간 전";
  return Math.round(m / 1440) + "일 전";
}
/* 로고는 빌드 시점에 저장소로 받아둔 파일을 쓴다 (외부 요청 없음).
   없는 종목은 첫 글자 아바타로 대체하고, 로딩 실패 시에도 같은 모양으로 떨어진다. */
var NO_LOGO = ["COHR", "FDXF", "FRT", "HONA", "KIM", "MNST", "MRSH", "MRVL", "PSKY", "Q", "TPL", "VMRK"];
function logoHtml(ticker, size, label){
  var px = size + "px";
  var st = 'width:' + px + ';height:' + px + ';font-size:' + Math.round(size * 0.42) + 'px';
  var mark = String(label || ticker).slice(0, 2);
  /* 한국 종목은 로고 파일이 없다 — 종목명 두 글자 아바타로 자리와 리듬을 맞춘다. */
  if (isKR() || NO_LOGO.indexOf(ticker) >= 0){
    return '<span class="lg ph" style="' + st + '">' + esc(mark) + '</span>';
  }
  return '<img class="lg" src="assets/logos/' + encodeURIComponent(ticker) + '.png" ' +
    'alt="" loading="lazy" decoding="async" style="' + st + '" ' +
    'onerror="this.outerHTML=&quot;<span class=\'lg ph\' style=\'' + st +
    '\'>' + esc(mark) + '</span>&quot;">';
}

function sparkSvg(sp, w, h){
  if (!sp || sp.length < 2) return "";
  var mn = Math.min.apply(null, sp), mx = Math.max.apply(null, sp), rng = (mx - mn) || 1;
  var px = function(i){ return (i / (sp.length - 1) * (w - 3) + 1.5).toFixed(1); };
  var py = function(v){ return (h - 2.5 - (v - mn) / rng * (h - 5)).toFixed(1); };
  var pts = sp.map(function(v, i){ return px(i) + "," + py(v); }).join(" ");
  /* 색은 등락률 숫자에만 쓰고, 스파크라인은 형태만 전달 (의미 중복 방지) */
  var col = "var(--t3)";
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" ' +
    'preserveAspectRatio="none" aria-hidden="true">' +
    '<polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="1.8" ' +
    'vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

/* ============ 장 상태 ============ */
function marketStatus(){
  var p = {};
  try {
    new Intl.DateTimeFormat("en-US", {timeZone:"America/New_York", weekday:"short",
      hour:"2-digit", minute:"2-digit", hour12:false})
      .formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
  } catch(e){ return {key:"", label:"미국 증시"}; }
  if (p.weekday === "Sat" || p.weekday === "Sun") return {key:"", label:"주말 휴장"};
  var m = (parseInt(p.hour, 10) % 24) * 60 + parseInt(p.minute, 10);
  if (m >= 570 && m < 960)  return {key:"open", label:"장중"};
  if (m >= 240 && m < 570)  return {key:"pre",  label:"프리마켓"};
  if (m >= 960 && m < 1200) return {key:"post", label:"애프터마켓"};
  return {key:"", label:"장 마감"};
}

/* 특정 시점의 미국 동부 시간이 UTC보다 몇 분 뒤인지 (서머타임 자동 반영) */
function etOffsetMin(d){
  var p = {};
  new Intl.DateTimeFormat("en-US", {timeZone:"America/New_York", year:"numeric",
    month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false})
    .formatToParts(d).forEach(function(x){ p[x.type] = x.value; });
  var asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute);
  return (asUTC - d.getTime()) / 60000;
}
/* 다음 정규장 개장(동부 09:30) 시각 */
function nextOpen(){
  var now = new Date();
  for (var i = 0; i < 8; i++){
    var probe = new Date(now.getTime() + i * 86400000), p = {};
    new Intl.DateTimeFormat("en-US", {timeZone:"America/New_York", year:"numeric",
      month:"2-digit", day:"2-digit", weekday:"short"})
      .formatToParts(probe).forEach(function(x){ p[x.type] = x.value; });
    if (p.weekday === "Sat" || p.weekday === "Sun") continue;
    var openUTC = Date.UTC(+p.year, +p.month - 1, +p.day, 9, 30) - etOffsetMin(probe) * 60000;
    if (openUTC > now.getTime()) return new Date(openUTC);
  }
  return null;
}

  if (!D || !LIVE || !LIVE.rows) return false;
  if (new Date(LIVE.generated_at) <= new Date(D.generated_at)) return false;
  var R = LIVE.rows, up = 0, down = 0;
  var apply = function(row){
    var v = R[row.ticker];

    row.last = v[0];
    if (v.length > 1 && v[1] !== null) row.day_pct = v[1];
  };
  (D.table || []).forEach(function(row){
    apply(row);
    if (has(row.day_pct)) { if (row.day_pct > 0) up++; else if (row.day_pct < 0) down++; }
  });
  (D.strategies || []).forEach(function(st){ (st.rows || []).forEach(apply); });
  if (D.market) { D.market.advancers = up; D.market.decliners = down; }
  if (LIVE.fx && has(LIVE.fx.rate)) {
    D.fx = D.fx || {};
    D.fx.rate = LIVE.fx.rate;
    if (has(LIVE.fx.day_pct)) D.fx.day_pct = LIVE.fx.day_pct;

/* ============ 매매 신호 ============
   규칙은 discover.py 의 signal_for() 하나뿐이고, 그 규칙과 성적을 화면에 그대로 편다.
   여기서 새 판단을 만들지 않는다 — 계산된 상태를 옮겨 적기만 한다. */
/* 규칙 본체. discover.py 의 signal_state() 와 같은 순서다.
   이 파일에도 두는 이유: discover.py 는 하루 한 번 도는데 시세는 3분마다 들어온다.
   다시 재지 않으면 손절선을 뚫고 내려간 종목이 하루 종일 «매수 구간»으로 남는다.
   문구·경계값은 여기 두지 않고 전부 데이터(D.signal)에서 받아 쓴다 — 갈라지지 않게. */
function sigState(last, s20, s50, s200, rsi, rsiMax){
  if (last < s50) return ["exit", "below_s50"];
  if (last > s200 && last > s20 && rsi < rsiMax) return ["buy", "trend"];
  if (last <= s200) return ["watch", "below_s200"];
  if (rsi >= rsiMax) return ["watch", "hot"];
  return ["watch", "below_s20"];
}
function sigLabel(sg){
  var m = D && D.signal && D.signal.labels;
  return (m && sg && m[sg.state]) || "";
}
function sigWhy(sg){
  var m = D && D.signal && D.signal.reasons;
  return (m && sg && m[sg.reason]) || "";
}
/* 들어온 시세로 상태를 고쳐 잡는다. 파이썬이 신호를 안 준 종목(분할 등)은 건드리지 않는다. */
function refreshSignals(){
  var g = D && D.signal;
  if (!g || !g.labels) return;
  var rsiMax = has(g.rsi_max) ? g.rsi_max : 70;
  var lo = (g.split && g.split[0]) || 0.65, hi = (g.split && g.split[1]) || 1.55;
  var fix = function(row){
    var s = row.signal;
    if (!s || !has(row.last) || !has(s.s20) || !has(s.stop) || !has(s.s200) || !has(s.rsi)) return;
    /* 장중 분할이면 시세만 새 기준이 된다 — 그 종목은 판단하지 않는다. */
    if (has(s.prev) && s.prev > 0 && !(lo < row.last / s.prev && row.last / s.prev < hi)){
      row.signal = null; return;
    }
    var st = sigState(row.last, s.s20, s.stop, s.s200, s.rsi, rsiMax);
    s.state = st[0]; s.reason = st[1];
  };
  (D.table || []).forEach(fix);
  (D.strategies || []).forEach(function(t){ (t.rows || []).forEach(fix); });
  var tally = {buy: 0, watch: 0, exit: 0};
  (D.table || []).forEach(function(r){ if (r.signal) tally[r.signal.state]++; });
  g.tally = tally;
}
function sigChip(sg){
  if (!sg || !sg.state) return "";
  return '<span class="sig ' + esc(sg.state) + '"><i></i>' + esc(sigLabel(sg)) + '</span>';
}
/* 목표가·손절선은 규칙이 정한 «자리»라 그대로 두고, 거기까지 거리만 지금 시세로 다시 잰다. */
function sigLevels(sg, last){
  if (!sg || !sg.state) return "";
  var px = has(last) ? last : null;
  var gap = function(v){ return (px && px > 0 && has(v)) ? (v / px - 1) * 100 : null; };
  var tgt = (has(sg.hi) && px && sg.hi > px)
    ? '<div class="v num">' + price(sg.hi) + '</div>' +
      '<div class="d num up">' + pct1(gap(sg.hi)) + '</div>'
    : '<div class="v num">' + NB + '</div><div class="d">이미 52주 최고가예요</div>';
  /* 청산 구간이면 손절선이 현재가 위에 있다 — 이미 뚫고 내려왔다는 뜻이라 이름을 바꾼다. */
  var stopK = sg.state === "exit" ? "청산선 · 이미 아래" : "손절선";
  var sp = gap(sg.stop);
  return '<div class="sig-lv">' +
    '<div><div class="k">목표가</div>' + tgt + '</div>' +
    '<div><div class="k">' + esc(stopK) + '</div>' +
      '<div class="v num">' + price(sg.stop) + '</div>' +
      '<div class="d num ' + cls(sp) + '">' + pct1(sp) + '</div></div>' +
  '</div>';
}
function sigWins(s){ return Math.round(s.months * s.win_rate / 100); }
/* 이 규칙이 과거에 어땠는지. 좋게 나오든 나쁘게 나오든 같은 자리에 같은 문장으로 적는다. */

function stateTags(r){

    else if (r.rsi14 <= 30) t.push(["단기 과매도", "cold"]);
  }
  if (has(r.vs_sma200)) t.push([r.vs_sma200 >= 0 ? "1년 평균 위" : "1년 평균 아래",

  if (has(r.vol_ann) && r.vol_ann >= 45) t.push(["변동 큼", "warn"]);
  if (r.next_earnings){
    var d = Math.round((new Date(r.next_earnings) - Date.now()) / 86400000);
    if (d >= 0 && d <= 14) t.push(["실적 발표 " + d + "일 뒤", "warn"]);
  }
  return t;
}

/* ============ 전적 ============
   기준마다 지수와 붙은 성적을 한 판에 세운다. 성적 있는 것을 승률 순으로 위에 놓고,
   잴 수 없는 기준은 왜 못 재는지 적어 아래에 그대로 남긴다 — 빼면 골라 보여준 게 된다. */
function recordList(){
  var out = (D && D.strategies || []).map(function(s){
    var b = BT && BT.strategies && BT.strategies[s.key];
    return {name: s.name, n: (s.rows || []).length,
            bt: (b && b.backtested) ? b : null,
            why: (b && !b.backtested) ? b.reason : "가격 기록만으로는 재현할 수 없어요."};
  });
  var sg = BT && BT.signal;
  if (sg && sg.backtested){
    out.push({name: "매매 신호 · 매수 구간", n: null, bt: sg, why: null});
  }
  out.sort(function(a, c){
    if (!!a.bt !== !!c.bt) return a.bt ? -1 : 1;
    if (!a.bt) return 0;
    return c.bt.win_rate - a.bt.win_rate;
  });
  return out;
}
function rankRow(x, i){
  var head = '<div class="rk-row"><span class="rk-n num">' + (x.bt ? (i + 1) : "—") + '</span>' +
    '<span class="rk-name">' + esc(x.name) + '</span>' +
    (x.n ? '<span class="rk-cnt">' + x.n + '종목</span>' : "");
  if (!x.bt){
    return '<div class="rk-item">' + head + '</div>' +
      '<div class="rk-none">' + esc(x.why) + '</div></div>';
  }
  var b = x.bt, w = Math.round(b.win_rate * b.months / 100), l = b.months - w;
  return '<div class="rk-item">' + head +
    '<span class="rk-wl num">' + w + '승 ' + l + '패</span></div>' +
    '<div class="rec-bar"><i style="width:' + b.win_rate + '%;background:var(--up)"></i>' +
      '<i style="width:' + (100 - b.win_rate) + '%;background:var(--down)"></i></div>' +
    '<div class="rk-sub">' +
      '<span>승률 <b class="num">' + num1(b.win_rate) + '%</b></span>' +
      '<span>월평균 <b class="num ' + cls(b.avg_monthly) + '">' + pct1(b.avg_monthly) + '</b></span>' +
      '<span>' + b.months + '개월 누적 <b class="num ' + cls(b.cumulative) + '">' + pct0(b.cumulative) +
        '</b> <span class="num">(' + esc(benchName()) + ' ' + pct0(b.bench_cumulative) + ')</span></span>' +
      '<span>최악의 달 <b class="num ' + cls(b.worst) + '">' + pct0(b.worst) + '</b></span>' +
    '</div></div>';
}
function renderRecord(){
  var box = $("recBoard");
  if (!box) return;
  var list = recordList(), scored = list.filter(function(x){ return x.bt; });
  if (!scored.length){
    box.innerHTML = '<p class="rec-none">아직 잴 수 있는 전적이 없어요.</p>';
    return;
  }
  var i = 0;
  box.innerHTML = '<div class="rk">' + list.map(function(x){
      return rankRow(x, x.bt ? i++ : -1); }).join("") + '</div>' +
    btCaveatHtml();
}

/* ============ 종목 상세 시트 ============ */
/* 기대 대비 %는 (실제-예상)/|예상| 이라 예상이 0 근처면 -3458% 같은 숫자가 나온다.
   수학은 맞지만 읽을 수 없는 값이라 «—» 로 두고 왜 비웠는지 아래에 적는다. */
function epsPctOk(q){ return has(q.est) && q.est > 0.05; }
function epsTable(h){
  if (!h || !h.length) return "";
  var hid = false;
  var rows = h.slice().reverse().map(function(q){
    var m = /^(\d{2})(\d{2})-(\d{2})/.exec(q.q || "");
    var ok = epsPctOk(q);
    if (!ok) hid = true;
    return '<tr><td>' + (m ? m[2] + "년 " + (+m[3]) + "월" : esc(q.q || NB)) + '</td>' +
      '<td class="num">' + (has(q.est) ? q.est.toFixed(2) : NB) + '</td>' +
      '<td class="num">' + (has(q.act) ? q.act.toFixed(2) : NB) + '</td>' +
      '<td class="num ' + (ok ? cls(q.pct) : "") + '">' + (ok ? pct1(q.pct) : NB) + '</td></tr>';
  }).join("");
  return '<table class="eps"><thead><tr><th>분기</th><th>예상 EPS</th><th>실제 EPS</th>' +
    '<th>기대 대비</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    (hid ? '<p class="hint">예상 EPS가 0 근처인 분기는 %가 뜻을 잃어 비워뒀어요.</p>' : "");
}
function findRow(ticker){
  var t = (D.table || []).find(function(r){ return r.ticker === ticker; });
  if (t) return t;
  var hit = null;
  (D.strategies || []).forEach(function(st){
    (st.rows || []).forEach(function(r){ if (r.ticker === ticker) hit = r; }); });
  return hit;
}
function belongsTo(ticker){
  return (D.strategies || []).filter(function(st){
    return (st.rows || []).some(function(r){ return r.ticker === ticker; }); });
}
function sheetNews(ticker){
  if (!NEWS || !NEWS.by_ticker) return [];
  return NEWS.by_ticker[ticker] || [];
}

    (function(){

    '</div></div>' +

  $("sheetBg").hidden = false; $("sheet").hidden = false;

    $("sheetBg").classList.add("on"); $("sheet").classList.add("on"); });
  document.body.style.overflow = "hidden";
}

    var mvU = has(last) ? h.qty * last : null;
    var r = { t:h.t, name: m ? m.name : null, qty:h.qty, cost:h.cost, last:last, day_pct:day,
      mvUsd:mvU, pnlUsd: has(mvU) ? mvU - h.qty * h.cost : null,
      pnlUsdPct: has(last) && h.cost ? (last / h.cost - 1) * 100 : null,
      mvKrw: has(mvU) && fx ? mvU * fx : null,
      pnlKrw: has(mvU) && fx && bfx ? mvU * fx - h.qty * h.cost * bfx : null };
    if (has(mvU)) {
      o.mvUsd += mvU; o.costUsd += h.qty * h.cost;
      if (fx) { o.mvKrw += mvU * fx; o.costKrw += h.qty * h.cost * (bfx || fx); }
      if (has(day)) o.dayUsd += mvU * day / (100 + day);
    }
    o.rows.push(r);
  });
  return o;
}
function pfTax(g){ return (!has(g) || g <= 2500000) ? 0 : (g - 2500000) * 0.22; }

function renderPortfolio(){
  TBL = {};
  (D && D.table || []).forEach(function(r){ TBL[r.ticker] = r; });
  $("tickerList").innerHTML = (D && D.table || []).map(function(r){
    return '<option value="' + esc(r.ticker) + '">' + esc(r.name || "") + "</option>"; }).join("");

  if (!PF.length){
    $("pfHero").innerHTML = '<div class="l">아직 등록한 종목이 없어요</div>' +
      '<div class="v" style="font-size:22px;margin-top:10px">내 주식을 넣어보세요</div>' +
      '<p class="hint" style="max-width:430px;margin:14px auto 0">아래에서 티커·수량·평단만 넣으면 지금 시세로 평가액과 손익을 계산합니다. ' +
      '<b>입력한 내용은 이 기기에만 저장되고 서버로 전송되지 않습니다.</b></p>';
    $("pfGrid").hidden = true; $("pfHoldCard").hidden = true;
    return;
  }
  var c = pfCompute();
  var pnlKrw = c.mvKrw - c.costKrw, pnlUsd = c.mvUsd - c.costUsd;
  $("pfHero").innerHTML = '<div class="l">총 평가액</div>' +
    '<div class="v num">' + (c.fx ? won0(c.mvKrw) + "원" : "$" + usd(c.mvUsd, 0)) + "</div>" +
    '<div class="c num ' + cls(c.fx ? pnlKrw : pnlUsd) + '">' +
      (c.fx ? swon(pnlKrw) + "원" : "$" + usd(pnlUsd, 0)) +
      (c.costUsd ? " (" + pct1(pnlUsd / c.costUsd * 100) + ")" : "") + "</div>";
  var g = function(l, v, k){ return '<div><div class="l">' + l + '</div><div class="v num ' + (k || "") + '">' + v + "</div></div>"; };
  $("pfGrid").innerHTML =
    g("오늘 변동", "$" + usd(c.dayUsd, 0), cls(c.dayUsd)) +
    g("달러 기준 손익", pct1(c.costUsd ? pnlUsd / c.costUsd * 100 : null), cls(pnlUsd)) +
    g("환율", c.fx ? usd(c.fx, 1) : NB) +
    g("전량 매도 시 세금", c.fx ? eok(pfTax(pnlKrw)) + "원" : NB);
  $("pfGrid").hidden = false;
  $("pfHolds").innerHTML = c.rows.map(function(r, i){
    return '<div class="hold">' + logoHtml(r.t, 32) + '<div><div class="tk">' + esc(r.t) + "</div>" +
      '<div class="qt">' + r.qty + "주 · 평단 $" + usd(r.cost, 2) + "</div></div>" +
      '<div class="r"><div class="a num">$' + usd(r.mvUsd, 0) + "</div>" +
      '<div class="b num ' + cls(r.pnlUsdPct) + '">' + pct1(r.pnlUsdPct) + "</div></div>" +
      '<button class="x" type="button" data-del="' + i + '" aria-label="' + esc(r.t) + ' 삭제">✕</button></div>';
  }).join("");
  $("pfHoldCard").hidden = false;
}

/* ============ 로드 ============ */
var loading = false;
function skeleton(){
  $("status").innerHTML = '<div class="card"><div class="sk" style="width:40%;height:22px"></div>' +
    '<div class="sk" style="width:92%"></div><div class="sk" style="width:78%"></div>' +
    '<div class="sk" style="width:85%"></div></div>';
}
function load(){
  if (loading) return;
  loading = true;
  if (!D) skeleton();
  var soft = function(u){ return fetch(u, {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }); };
  Promise.all([
    fetch(mkFile("discover") + "?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
    soft(mkFile("news") + "?t=" + Date.now()),
    soft(mkFile("live") + "?t=" + Date.now()),
    soft(mkFile("backtest") + "?t=" + Date.now())
  ]).then(function(res){
    D = res[0]; if (res[1]) NEWS = res[1]; LIVE = res[2]; if (res[3]) BT = res[3];
    mergeLive();
    /* 렌더 오류를 네트워크 오류와 섞지 않는다 — 섞으면 화면이 조용히 멈춘다 */
    try { renderAll(); }
    catch (err) {
      console.error("렌더 실패:", err);
      $("status").innerHTML = '<div class="rec-none">화면을 그리는 중 문제가 생겼습니다. ' +
        esc(err && err.message ? err.message : String(err)) + '</div>';
    }
  }).catch(function(e){
    if (!D) $("status").innerHTML = '<div class="card"><h2 style="margin:0 0 8px;font-size:17px">' +
      '데이터를 불러오지 못했습니다</h2><p class="hint" style="margin:0 0 14px">' + esc(e.message) +
      ' — 잠시 후 다시 시도해 주세요.</p><button class="btn" type="button" data-retry>다시 시도</button></div>';
  }).finally(function(){ loading = false; });
}

/* ============ 적응형 폴링 ============ */
var pollTimer = null, tick = 0;
function pollOnce(){
  if (!D) { load(); return; }
  tick++;
  if (!isLive() || tick % 8 === 0) { load(); return; }
  fetch(mkFile("live") + "?t=" + Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j) return;
      LIVE = j;
      if (mergeLive()) { paintStatus(); renderMarket(); renderStrategies(); renderTable(); renderPortfolio(); }
      else paintStatus();
    }).catch(function(){});
}
function schedulePoll(){
  clearTimeout(pollTimer);
  pollTimer = setTimeout(function(){ pollOnce(); schedulePoll(); }, isLive() ? 45000 : 600000);
}

    x.setAttribute("aria-selected", x.getAttribute("data-mk") === mk ? "true" : "false"); });

});
$("sheetBody").addEventListener("click", function(e){

$("uniHead").addEventListener("click", function(e){ sortTh(e); });
$("uniHead").addEventListener("keydown", function(e){
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sortTh(e); } });
function sortTh(e){
  var th = e.target.closest ? e.target.closest("th[data-k]") : null;
  if (!th || !D) return;
  var k = th.getAttribute("data-k");
  if (tblState.sortK === k) tblState.dir = tblState.dir === "desc" ? "asc" : "desc";
  else { tblState.sortK = k; tblState.dir = COL_BY_KEY[k].str ? "asc" : "desc"; }

}

$("q").addEventListener("input", function(){

});

$("refreshBtn").addEventListener("click", load);
$("status").addEventListener("click", function(e){
  if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-retry")) load(); });

$("pfAdd").addEventListener("click", function(){
  var t = ($("pfTicker").value || "").trim().toUpperCase();
  var qty = parseFloat($("pfQty").value), cost = parseFloat($("pfCost").value), bfx = parseFloat($("pfFx").value);
  if (!TBL[t]) { $("pfNote").textContent = "'" + t + "' 는 S&P 500 목록에 없는 티커입니다."; return; }
  if (!(qty > 0) || !(cost > 0)) { $("pfNote").textContent = "수량과 평단을 숫자로 입력해 주세요."; return; }
  var row = { t:t, qty:qty, cost:cost };
  if (bfx > 0) row.bfx = bfx;
  var i = PF.findIndex(function(x){ return x.t === t; });
  if (i >= 0) PF[i] = row; else PF.push(row);
  pfSave(PF);
  ["pfTicker","pfQty","pfCost","pfFx"].forEach(function(id){ $(id).value = ""; });
  $("pfNote").textContent = t + " 추가했습니다.";
  renderPortfolio(); renderNews();
});
$("pfHolds").addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("[data-del]") : null;
  if (!b) return;
  PF.splice(parseInt(b.getAttribute("data-del"), 10), 1);
  pfSave(PF); renderPortfolio(); renderNews();
});
$("pfExport").addEventListener("click", function(){
  var code = JSON.stringify(PF);
  var ok = function(){ $("pfNote").textContent = "백업 코드를 복사했습니다. 다른 기기의 '가져오기'에 붙여넣으세요."; };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(code).then(ok, function(){ window.prompt("아래 코드를 복사하세요", code); });
  else window.prompt("아래 코드를 복사하세요", code);
});
$("pfImport").addEventListener("click", function(){
  var v = window.prompt("백업 코드를 붙여넣으세요");
  if (!v) return;
  try {
    var arr = JSON.parse(v);
    if (!Array.isArray(arr)) throw new Error("형식 오류");
    PF = arr.filter(function(x){ return x && x.t && x.qty > 0 && x.cost > 0; });
    pfSave(PF); renderPortfolio(); renderNews();
    $("pfNote").textContent = PF.length + "종목을 가져왔습니다.";
  } catch(e){ $("pfNote").textContent = "가져오기 실패 — 백업 코드 형식이 아닙니다."; }
});

/* 테마: 시스템 → 라이트 → 다크 */
var THEMES = ["", "light", "dark"], ICON = {"":"◐", light:"☀", dark:"☾"};
(function(){
  var cur = "";
  try { cur = localStorage.getItem("sb_theme") || ""; } catch(e){}
  var apply = function(t){
    if (t) document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    $("themeBtn").textContent = ICON[t];
  };
  apply(cur);
  $("themeBtn").addEventListener("click", function(){
    cur = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
    try { localStorage.setItem("sb_theme", cur); } catch(e){}
    apply(cur);
  });
})();

document.addEventListener("visibilitychange", function(){
  if (!document.hidden) { paintStatus(); pollOnce(); schedulePoll(); }
});

/* 애플식 스크롤 등장 */
var io = null;
if (window.IntersectionObserver &&
    !window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  }, {rootMargin:"0px 0px -8% 0px", threshold:.06});
}
function animateIn(){
  if (!io) return;
  /* 이미 화면에 있는 요소는 즉시 보여주고, 아래에 있는 것만 스크롤 시 등장시킨다.
     (관찰자에만 맡기면 첫 화면 콘텐츠가 투명하게 남는 경우가 있다) */
  var vh = window.innerHeight || 800;
  document.querySelectorAll(".sec-h:not(.rise), .picks:not(.rise), .top:not(.rise), #mkt:not(.rise)")
    .forEach(function(el){
      el.classList.add("rise");
      if (el.getBoundingClientRect().top < vh * 0.95) el.classList.add("in");
      else io.observe(el);
    });
}
var _renderAll = renderAll;
renderAll = function(){ _renderAll(); animateIn(); };

try { var mk0 = localStorage.getItem("sb_market");
  if (mk0 === "kr"){ market = "kr";
    $("mkts").querySelectorAll("[data-mk]").forEach(function(x){
      x.setAttribute("aria-selected", x.getAttribute("data-mk") === "kr" ? "true" : "false"); }); }
} catch(e){}

var h = (location.hash || "").replace("#", "");
if (h === "news" || h === "mine") setView(h);
paintStatus();
load();
schedulePoll();
setInterval(paintStatus, 15000);
})();
